spring:
  application:
    name: supermarket-backend
  datasource:
    url: jdbc:h2:file:./data/supermarket;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: supermarket-warehouse-management-system-secret-key-2025
    expiration-ms: 86400000
