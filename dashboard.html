<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超市货物仓库管理系统 - 控制台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">🏪</div>
            <div class="sidebar-title">
                <h2>仓库管理系统</h2>
                <small>SWMS v1.0</small>
            </div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
            <!-- 由 JS 动态生成 -->
        </nav>
        <div class="sidebar-footer">
            <span id="currentUser"></span>
        </div>
    </aside>

    <!-- 主内容区 -->
    <div class="main-wrapper">
        <!-- 顶部栏 -->
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle" title="折叠菜单">☰</button>
            <div class="topbar-title" id="pageTitle">控制台</div>
            <div class="topbar-actions">
                <span class="topbar-time" id="currentTime"></span>
                <span class="topbar-role-badge" id="roleBadge"></span>
                <button class="btn-logout" id="btnLogout">退出登录</button>
            </div>
        </header>

        <!-- 内容区 -->
        <main class="content" id="mainContent">
            <!-- 各模块页面由 JS 动态渲染 -->
        </main>
    </div>

    <!-- 模态框容器 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <div class="confirm-icon">⚠️</div>
            <p id="confirmMsg"></p>
            <div class="confirm-actions">
                <button class="btn-cancel" id="confirmCancel">取消</button>
                <button class="btn-danger" id="confirmOk">确认</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
